<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="content-language" content="fr-FR">
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo/vendoscity-logo.svg?v=20260327-logo3">
  <link rel="icon" type="image/png" href="/favicon.png">
  
  <link rel="manifest" href="/manifest.webmanifest?v=2026-03-27-iconfix1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=20260327-iconfix2">
  <meta name="theme-color" content="#ff6a00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Vendeur - Vendoscity</title>
  <meta name="description" content="Consultez le profil d'un vendeur et tous ses articles publiés sur Vendoscity.">
  <link rel="canonical" href="https://vendoscity.com/pages/Vendeur">
  <link rel="stylesheet" href="/style/style.css" media="all">
  <link rel="stylesheet" href="/style/boutique.css" media="all">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .seller-hero {
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-2));
      color: white;
      padding: 50px 20px;
      border-bottom: 4px solid var(--color-yellow);
    }
    .seller-hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
    }
    .seller-title {
      margin: 0 0 6px 0;
      font-size: 2rem;
      line-height: 1.2;
    }
    .seller-subtitle {
      margin: 0;
      opacity: 0.95;
      max-width: 70ch;
    }
    .seller-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .seller-actions a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
    }
    .seller-actions a:hover {
      border-color: rgba(255,255,255,0.6);
    }
    .seller-body {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 70px 20px;
    }
    .seller-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .seller-bio {
      color: #444;
      margin: 0;
      line-height: 1.7;
    }
    .seller-products-title {
      margin: 22px 0 12px 0;
      color: var(--primary-blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    @media (max-width: 768px) {
      .seller-hero-inner {
        grid-template-columns: 1fr;
      }
      .seller-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body class="vc-page-seller">
  <div id="header-placeholder"></div>

  <main id="main-content" role="main">
    <section class="seller-hero" aria-label="Profil vendeur">
      <div class="seller-hero-inner">
        <div>
          <h1 class="seller-title" id="seller-name">Vendeur</h1>
          <p class="seller-subtitle">Consultez les articles publiés par ce vendeur. Paiement et livraison se discutent directement avec le vendeur.</p>
        </div>
        <div class="seller-actions">
          <button type="button" id="btn-share-shop-header" style="background: none; border: 1px solid rgba(255,255,255,0.25); color: white; padding: 10px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;" aria-label="Partager la boutique">
            <i data-lucide="share-2" width="18" height="18"></i> Partager
          </button>
          <a href="./Boutique.html" aria-label="Retour à la boutique">
            <i data-lucide="store"></i> Boutique
          </a>
          <a href="./Boutique.html#panier" aria-label="Aller au panier (dans la boutique)">
            <i data-lucide="shopping-cart"></i> Panier
          </a>
        </div>
      </div>
    </section>

    <div class="seller-body">
      <div class="seller-card" id="seller-bio-card" style="display:none;">
        <p class="seller-bio" id="seller-bio"></p>
      </div>

      <h2 class="seller-products-title"><i data-lucide="package"></i> Articles publiés</h2>
      <div id="seller-products-grid" class="products-grid" aria-live="polite"></div>
      <div id="seller-products-empty" style="display:none; color:#666; padding:12px 0;">Aucun produit publié pour le moment.</div>
      <div id="seller-products-error" style="display:none; color: var(--color-red); padding:12px 0;">Impossible de charger les produits de ce vendeur.</div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/script/config.js"></script>
  <script src="/script/script.js"></script>
  <script src="/script/component-loader.js"></script>
  <script src="/script/seller-public.js"></script>
</body>
</html>
