name: Render Keepalive

on:
  schedule:
    # GitHub Actions cron is best-effort; 5 minutes is the smallest practical interval.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render backend
        run: |
          set -euo pipefail
          curl -fsS -H "User-Agent: vendoscity-gh-keepalive" "https://vendoscity.onrender.com/api/ping" >/dev/null

